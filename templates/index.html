<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal de Bitcoin</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            margin: 20px;
        }
        .header {
            font-size: 36px;
            margin: 20px;
        }
        .button {
            background-color: #6200ea;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #3700b3;
        }
        img {
            width: 300px;
            margin: 20px;
            border-radius: 10px;
        }
        .graph-container {
            width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="header">Bienvenido a la Página de Bitcoin</div>

    <!-- Imagen -->
    <img src="/static/image.jpg" alt="Imagen de Bitcoin">

    <!-- Gráfico de Velas -->
    <div class="graph-container">
        <iframe src="/static/grafica_bitcoin.html" width="100%" height="600px" frameborder="0"></iframe>
    </div>

    <!-- Botones -->
    <div>
        <button class="button">Ver más datos</button>
        <button class="button">Comprar Bitcoin</button>
    </div>
</body>
</html>
